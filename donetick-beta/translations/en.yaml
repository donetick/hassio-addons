configuration:
  storage_type:
    name: Storage provider
    description: Auto preserves existing backend configuration (S3 when unconfigured). Use s3 for an external or self-hosted S3-compatible service. Local filesystem storage is an explicit development option, not recommended for production.
  storage_base_path:
    name: S3 prefix or local upload directory
    description: Leave unset or blank to preserve the S3 prefix. Explicitly selecting local defaults to /data/uploads unless a directory is supplied. Keep local files under /data for persistence.
  storage_bucket_name:
    name: S3 bucket
    description: Bucket created on your S3-compatible service. Leave unset or blank to preserve backend configuration.
  storage_region:
    name: S3 region
    description: Region specified by your storage provider. Leave unset or blank to preserve backend configuration.
  storage_access_key:
    name: S3 access key
    description: Access key for your S3-compatible service. Leave unset or blank to preserve backend configuration.
  storage_secret_key:
    name: S3 secret key
    description: Secret key for your S3-compatible service. Leave unset or blank to preserve backend configuration.
  storage_endpoint:
    name: S3 endpoint
    description: Endpoint URL for a self-hosted or hosted S3-compatible service. Leave unset or blank to preserve backend configuration; the backend default is AWS S3.
  storage_path_style:
    name: S3 path-style addressing
    description: Enable for services requiring endpoint/bucket/key addressing. Omit to preserve backend configuration; false explicitly disables it. Requires a backend release supporting storage.path_style.
  storage_max_file_size:
    name: Maximum attachment size (bytes)
    description: Positive size limit for a single attachment. For example, 10485760 is 10 MiB. Omit to preserve backend configuration; a zero backend limit can block uploads.
  storage_max_user_storage:
    name: Storage quota (bytes)
    description: Positive storage quota enforced by the backend. For example, 104857600 is 100 MiB. Omit to preserve backend configuration; a zero backend quota can block uploads.
  storage_public_host:
    name: S3 signer host override
    description: Optional host without scheme for the URL signer. Does not configure the profile photo CDN host or make a bucket public. Omit to preserve backend configuration.
  storage_public_read:
    name: Unsigned S3 attachment URLs
    description: Enable only if the bucket or prefix already allows anonymous reads. Does not set bucket permissions. Omit to preserve backend configuration; false explicitly disables unsigned attachment URLs.
  storage_public_bucket_name:
    name: Public asset bucket
    description: Optional separate bucket for profile photos. Omit to preserve backend configuration; the backend falls back to the main bucket if none is configured.
  storage_public_bucket_host:
    name: Public profile asset host
    description: HTTPS CDN or public bucket host without scheme or path for permanent profile photo URLs. The uploaded profile objects must allow anonymous reads. Without it, profile URLs are presigned and expire.
