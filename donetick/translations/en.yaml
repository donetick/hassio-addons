configuration:
  storage_type:
    name: Storage provider
    description: Auto preserves existing backend configuration (S3 when unconfigured). Use s3 for an external or self-hosted S3-compatible service. Local filesystem storage is an explicit development option, not recommended for production.
  storage_base_path:
    name: S3 prefix or local upload directory
    description: Leave unset or blank to preserve the S3 prefix. Explicitly selecting local defaults to /data/uploads unless a directory is supplied. Keep local files under /data for persistence.
  storage_bucket_name:
    name: S3 bucket
    description: Bucket created on your S3-compatible service. Leave unset or blank to preserve backend configuration.
  storage_region:
    name: S3 region
    description: Region specified by your storage provider. Leave unset or blank to preserve backend configuration.
  storage_access_key:
    name: S3 access key
    description: Access key for your S3-compatible service. Leave unset or blank to preserve backend configuration.
  storage_secret_key:
    name: S3 secret key
    description: Secret key for your S3-compatible service. Leave unset or blank to preserve backend configuration.
  storage_endpoint:
    name: S3 endpoint
    description: Endpoint URL for a self-hosted or hosted S3-compatible service. Leave unset or blank to preserve backend configuration; the backend default is AWS S3.
  storage_path_style:
    name: S3 path-style addressing
    description: Enable for services requiring endpoint/bucket/key addressing. Omit to preserve backend configuration; false explicitly disables it. Requires a backend release supporting storage.path_style.
