name: Test storage configuration

on:
  push:
  pull_request:

jobs:
  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML==6.0.2
      - run: python -m unittest discover -s tests -v
